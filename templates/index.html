<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client SharePoint Search</title>
<script src="{{ url_for('static', filename='theme.js', v=asset_v) }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
</head>
<body>
<header class="topbar topbar-end">
  <nav>
    <a href="{{ url_for('admin') }}">Admin</a>
    <a href="{{ url_for('logout') }}">Log out</a>
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-pressed="false" aria-label="Switch between light and dark">Dark</button>
  </nav>
</header>

<main>
  <div class="brandmark">
    <img class="brandmark-logo" src="{{ url_for('static', filename='logo.png') }}" alt="">
    <span class="wordmark">Client SharePoint Search</span>
  </div>
  <h1 class="ask">Which client's folder?</h1>
  <p class="ask-sub">Partial names and typos still find the client.</p>

  <label class="sr-only" for="search">Search clients by name or Client ID</label>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Type a client name or ID…"
           autocomplete="off" disabled
           role="combobox" aria-expanded="false" aria-controls="results"
           aria-autocomplete="list" aria-describedby="search-hint">
  </div>

  <ul id="results" role="listbox" aria-label="Matching clients"></ul>

  <div class="search-msg">
    <p class="feedback" id="feedback" role="alert"></p>
    <p class="search-hint" id="search-hint">
      Type a full name or Client ID and press <kbd>Enter</kbd> to open the folder.
      Partial names and typos still find matches — pick one with
      <kbd>↑</kbd> <kbd>↓</kbd> then <kbd>Enter</kbd>, or click it.
    </p>
  </div>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main>

<script src="{{ url_for('static', filename='fuse.min.js') }}"></script>
<script src="{{ url_for('static', filename='search.js', v=asset_v) }}"></script>
</body>
</html>
