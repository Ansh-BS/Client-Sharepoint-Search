<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Client SharePoint Search</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="narrow">
  <img class="logo logo-standalone" src="{{ url_for('static', filename='logo.png') }}" alt="Benison Solvers">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label class="sr-only" for="password">Staff password</label>
    <input id="password" type="password" name="password"
           placeholder="Staff password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Log in</button>
  </form>
</main>
</body>
</html>
